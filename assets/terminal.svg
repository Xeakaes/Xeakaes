<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <style>
      <![CDATA[
        text { font-family: 'Consolas','SFMono-Regular','Menlo',monospace; }
        .prompt { fill: #39d353; }
        .path   { fill: #58a6ff; }
        .out    { fill: #c9d1d9; }
        .dim    { fill: #6e7681; }
        .hdr    { fill: #f0f6fc; font-weight: 700; }

        .line {
          opacity: 0;
          animation: reveal 0.4s ease-out forwards;
        }
        @keyframes reveal {
          from { opacity: 0; transform: translateY(3px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .l1  { animation-delay: 0.0s; }
        .l2  { animation-delay: 0.3s; }
        .l3  { animation-delay: 0.9s; }
        .l4  { animation-delay: 1.2s; }
        .l5  { animation-delay: 1.5s; }
        .l6  { animation-delay: 1.8s; }
        .l7  { animation-delay: 2.4s; }
        .l8  { animation-delay: 2.7s; }
        .l9  { animation-delay: 3.3s; }
        .l10 { animation-delay: 3.6s; }
        .l11 { animation-delay: 4.2s; }
        .l12 { animation-delay: 4.5s; }

        .cursor {
          animation: blink 1s step-start infinite;
        }
        @keyframes blink {
          50% { opacity: 0; }
        }
      ]]>
    </style>
  </defs>

  <rect width="900" height="500" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="498" rx="13" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="38" rx="13" fill="#161b22"/>
  <rect x="1" y="26" width="898" height="13" fill="#161b22"/>
  <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" font-size="13" fill="#8b949e">kaan@xeakaes: ~</text>

  <g font-size="15.5">
    <text class="line l1" x="34" y="72"><tspan class="prompt">~ $ </tspan><tspan class="out">whoami</tspan></text>
    <text class="line l2" x="34" y="98" font-size="21" ><tspan class="hdr">Xeakaes</tspan><tspan class="out" font-size="15"> — Medical Student &amp; Hobbyist Developer</tspan></text>

    <text class="line l3" x="34" y="136"><tspan class="prompt">~ $ </tspan><tspan class="out">cat about.txt</tspan></text>
    <text class="line l4" x="34" y="160"><tspan class="dim">&gt; </tspan><tspan class="out">Python, PyQt6, PyVista, CuPy &amp; Android — desktop and mobile tools</tspan></text>
    <text class="line l5" x="34" y="182"><tspan class="dim">&gt; </tspan><tspan class="out">PC performance tuning — GPU undervolting, low-level Windows tweaks</tspan></text>
    <text class="line l6" x="34" y="204"><tspan class="dim">&gt; </tspan><tspan class="out">Drawn to computational/physics-heavy problems — CFD, GPU numerics</tspan></text>

    <text class="line l7" x="34" y="242"><tspan class="prompt">~ $ </tspan><tspan class="out">ls ./projects</tspan></text>
    <text class="line l8" x="34" y="266"><tspan class="path">PcHWmonitor/</tspan><tspan class="out">    </tspan><tspan class="path">AeroVision-CFD/</tspan></text>

    <text class="line l9" x="34" y="304"><tspan class="prompt">~ $ </tspan><tspan class="out">cat projects/PcHWmonitor/README.md</tspan></text>
    <text class="line l10" x="34" y="328"><tspan class="dim">&gt; </tspan><tspan class="out">Android + Windows app streaming live PC hardware stats over Wi-Fi</tspan></text>

    <text class="line l11" x="34" y="388"><tspan class="prompt">~ $ </tspan><tspan class="out">cat projects/AeroVision-CFD/README.md</tspan></text>
    <text class="line l12" x="34" y="412"><tspan class="dim">&gt; </tspan><tspan class="out">Modular CFD wind tunnel sim (PyQt6 + PyVista) — Navier-Stokes solver,</tspan></text>
    <text x="34" y="434" class="line l12"><tspan class="dim">&gt; </tspan><tspan class="out">LES/RANS turbulence models, GPU/CPU fallback via CuPy</tspan></text>

    <text class="line l12" x="34" y="462"><tspan class="prompt">~ $ </tspan><tspan class="cursor out">▍</tspan></text>
  </g>
</svg>
