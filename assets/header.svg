<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg)"/>
  <rect width="900" height="280" rx="14" fill="url(#glow)"/>
  <rect x="1" y="1" width="898" height="278" rx="13" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- faint circuit-style dots -->
  <g fill="#30363d">
    <circle cx="820" cy="40" r="2.5"/>
    <circle cx="850" cy="60" r="2.5"/>
    <circle cx="800" cy="80" r="2.5"/>
    <circle cx="860" cy="100" r="2.5"/>
    <circle cx="790" cy="50" r="2.5"/>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="820" y1="40" x2="850" y2="60"/>
    <line x1="850" y1="60" x2="800" y2="80"/>
    <line x1="800" y1="80" x2="860" y2="100"/>
    <line x1="790" y1="50" x2="820" y2="40"/>
  </g>

  <!-- terminal-style prompt -->
  <text x="48" y="56" font-family="'Segoe UI Mono','Consolas',monospace" font-size="15" fill="#8b949e">~ $ whoami</text>

  <text x="48" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="42" font-weight="700" fill="#f0f6fc">Xeakaes</text>
  <text x="48" y="128" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="url(#accent)">Medical Student · Hobbyist Developer</text>

  <line x1="48" y1="150" x2="852" y2="150" stroke="#21262d" stroke-width="1"/>

  <g font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#c9d1d9">
    <circle cx="53" cy="177" r="3" fill="#58a6ff"/>
    <text x="66" y="182">Building desktop &amp; mobile tools in Python, PyQt6, PyVista, CuPy and Android</text>

    <circle cx="53" cy="205" r="3" fill="#58a6ff"/>
    <text x="66" y="210">PC performance tuning — GPU undervolting/overclocking, low-level Windows tweaks</text>

    <circle cx="53" cy="233" r="3" fill="#58a6ff"/>
    <text x="66" y="238">Drawn to computational/physics-heavy problems — CFD, GPU-accelerated numerics</text>
  </g>
</svg>
